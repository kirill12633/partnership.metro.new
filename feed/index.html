<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лента — Metro New Partnership</title>
<link rel="icon" type="image/png" href="https://kirill12633.github.io/Metro.New.Official/ru/images/metro-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root, [data-theme="light"] {
    --bg: #f7f7f8; --card: #ffffff; --border: #e4e4e7; --border-hover: #d4d4d8;
    --text: #0a0a0a; --dim: #6b6b70; --dim-2: #9a9aa0;
    --accent: #111111; --accent-text: #ffffff; --accent-soft: #ebebee;
    --font: 'Inter', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0a0a0a; --card: #141414; --border: #232323; --border-hover: #333333;
    --text: #f4f4f4; --dim: #9a9a9a; --dim-2: #6b6b6b;
    --accent: #f4f4f4; --accent-text: #0a0a0a; --accent-soft: #1a1a1a;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px; -webkit-font-smoothing: antialiased; transition: background .3s, color .3s; }
  .container { max-width: 440px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px 32px; box-shadow: 0 4px 16px rgba(0,0,0,.04); }
  .icon { font-size: 64px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
  p { font-size: 14px; color: var(--dim); line-height: 1.6; margin-bottom: 28px; }
  .btn { display: inline-block; padding: 13px 26px; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-size: 14px; font-weight: 600; text-decoration: none; transition: all .2s; margin: 4px; }
  .btn:hover { opacity: .85; transform: translateY(-1px); }
  .btn-secondary { display: inline-block; padding: 13px 26px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; font-weight: 600; text-decoration: none; transition: all .2s; margin: 4px; }
  .btn-secondary:hover { border-color: var(--border-hover); background: var(--accent-soft); }
  .beta { font-size: 11px; color: var(--dim-2); margin-top: 20px; }
  .theme-btn { position: fixed; top: 24px; right: 24px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: all .2s; }
  .theme-btn:hover { border-color: var(--border-hover); background: var(--accent-soft); }
</style>
</head>
<body>

<button class="theme-btn" id="themeBtn">🌙</button>

<div class="container">
  <div class="icon">📱</div>
  <h1>Лента скоро</h1>
  <p>Здесь будет вертикальная лента серверов — как Shorts. Свайпайте вверх-вниз, чтобы смотреть серверы, влево — пропустить, вправо — добавить в избранное и предложить пиар.</p>
  <a class="btn" href="https://kirill12633.github.io/partnership.metro.new/">← В каталог</a>
  <a class="btn-secondary" href="https://kirill12633.github.io/partnership.metro.new/add/">Добавить сервер</a>
  <p class="beta">Платформа работает в бета-режиме. Возможны баги и изменения.</p>
</div>

<script>
  const themeBtn = document.getElementById('themeBtn');
  const savedTheme = localStorage.getItem('metro_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('metro_theme', next);
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  });
</script>
</body>
</html>
